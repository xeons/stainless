name: Set up the toolchain
description: >
  The .NET SDK, a NuGet cache, and clang. On Linux also the GTK 3 development
  packages, the 32-bit libc the x86 cases link against, and Xvfb for the
  IDE's self test when a release is published. On macOS Homebrew's LLVM,
  which is the supported clang there, libgd for the drawing case, and
  Rosetta for the Intel lane.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: nuget-${{ runner.os }}-

    # libc6-dev:i386 is what a newer clang needs to find the i386 headers;
    # tests/linux-x86.Dockerfile says why.
    - name: Install clang and the GTK and 32-bit development packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang libgtk-3-dev gcc-multilib libc6-dev:i386 xvfb

    # Apple's clang is on PATH and is not the one the compiler supports, so
    # STAINLESS_CLANG names Homebrew's for every later step.
    - name: Install LLVM, libgd and Rosetta
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm gd
        echo "STAINLESS_CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
        if [ ! -f /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

    # The generated bindings cases check what one SDK's headers say, and
    # sdk.txt names it. The Xcode that ships it is selected, and SDKROOT is
    # what Homebrew's clang compiles against; without that Xcode the cases
    # are skipped, saying why.
    - name: Select the SDK the bindings were generated from
      if: runner.os == 'macOS'
      shell: bash
      run: |
        version=$(tr -d '[:space:]' < tests/cases/macos-bindings-layout/sdk.txt)
        if [ -d "/Applications/Xcode_$version.app" ]; then
          sudo xcode-select -s "/Applications/Xcode_$version.app"
        fi
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
        xcrun --show-sdk-version

    # The Windows image ships LLVM in C:\Program Files\LLVM, which the compiler
    # searches after PATH.
    - name: Report clang
      shell: bash
      run: |
        if [ -n "${STAINLESS_CLANG:-}" ]; then
          "$STAINLESS_CLANG" --version
        elif command -v clang >/dev/null; then
          clang --version
        else
          "/c/Program Files/LLVM/bin/clang" --version
        fi
