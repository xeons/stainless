name: Set up the toolchain
description: >
  The .NET SDK, a NuGet cache, and clang. On Linux also the GTK 3 development
  packages and the 32-bit libc the x86 cases link against.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: nuget-${{ runner.os }}-

    # libc6-dev:i386 is what a newer clang needs to find the i386 headers;
    # tests/linux-x86.Dockerfile says why.
    - name: Install clang and the GTK and 32-bit development packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang libgtk-3-dev gcc-multilib libc6-dev:i386

    # The Windows image ships LLVM in C:\Program Files\LLVM, which the compiler
    # searches after PATH.
    - name: Report clang
      shell: bash
      run: |
        if command -v clang >/dev/null; then
          clang --version
        else
          "/c/Program Files/LLVM/bin/clang" --version
        fi
