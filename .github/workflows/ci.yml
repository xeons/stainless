name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Prefixed, because a workflow that calls this one names github.workflow, and a
# group shared with the caller would wait on itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The runners' clang is older than 21 and verifies nothing it links.
  STAINLESS_VERIFY_IR: 1

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The whole history, because the build number is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: dotnet build Stainless.slnx

      - run: dotnet test tests/Stainless.UnitTests --no-build

  end-to-end:
    name: End-to-end ${{ matrix.shard }}/2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: dotnet build Stainless.slnx

      - run: dotnet run --project tests/Stainless.Tests --no-build -- --shard=${{ matrix.shard }}/2

  # Every case built as Intel code and run under Rosetta on Apple silicon. A
  # case the target cannot run is skipped by the harness, so the step after
  # it checks that the lane ran something rather than skipping everything.
  #
  # Off: Intel Macs are a target the compiler builds for and not one that is
  # shipped, and Homebrew no longer installs on them. The x64-macos cases
  # that check the IR against clang's still run in every lane. Delete the
  # `if` to run the whole suite this way again.
  intel-mac:
    if: false
    name: End-to-end ${{ matrix.shard }}/2 (x64-macos under Rosetta)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: dotnet build Stainless.slnx

      # The drawing case loads libgd, and an Intel process cannot load the
      # arm64 one. Homebrew no longer installs on Intel macOS, so there is no
      # Intel libgd to give it; the arm64 lanes run it.
      - name: Run the suite as x64-macos
        shell: bash
        run: |
          dotnet run --project tests/Stainless.Tests --no-build -- \
            --target=x64-macos --exclude=drawing --shard=${{ matrix.shard }}/2 | tee e2e.log
          grep -Eq 'all [1-9][0-9]* tests passed' e2e.log
